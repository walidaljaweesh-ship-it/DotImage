
name: Build DotImage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract mobile project
        run: |
          unzip -q "mobile-fixed-new.zip" -d extracted
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set and verify Cloudflare API URL
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/main.dart")
          source = path.read_text()
          fixed = "const String apiBaseUrl = 'https://image-ai-server.almhmdq251.workers.dev';"
          source, count = re.subn(
              r"(?m)^const String apiBaseUrl\s*=\s*[^;]+;",
              fixed,
              source,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one apiBaseUrl declaration; found {count}")
          path.write_text(source)

          check = path.read_text()
          if fixed not in check:
              raise SystemExit("Cloudflare API URL verification failed")
          if "image.ai-server" in check or "image-ai-server.almhmdg251.workers.dev" in check:
              raise SystemExit("An incorrect API hostname remains in lib/main.dart")
          print("Verified API base URL:", fixed)
          PY

      - name: Prepare Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms android --org com.dotbhai --project-name dotimage .
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotImage-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
