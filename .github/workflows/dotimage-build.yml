
name: Build DotImage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract mobile project
        run: |
          unzip -q " mobile-fixed.zip" -d extracted
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android project
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          sed -i 's|http://10.0.2.2:3000|https://image-ai-server.almhmdq251.workers.dev|g; s|http://image-ai-server.almhmdg251.workers.dev|https://image-ai-server.almhmdq251.workers.dev|g; s|https://image-ai-server.almhmdg251.workers.dev|https://image-ai-server.almhmdq251.workers.dev|g; s|image-ai-server.almhmdg251.workers.dev|image-ai-server.almhmdq251.workers.dev|g' lib/main.dart
          flutter create --platforms android --org com.dotbhai --project-name dotimage .
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotImage-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
