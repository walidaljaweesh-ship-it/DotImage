
name: Build DotImage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.dotbhai --project-name dotimage --platforms android dotimage_app

      - name: Extract original DotImage files
        run: |
          mkdir source
          unzip -q mobile.zip -d source
          test -f source/lib/main.dart
          test -f source/pubspec.yaml
          cp -r source/lib/. dotimage_app/lib/
          cp source/pubspec.yaml dotimage_app/pubspec.yaml

      - name: Install dependencies
        working-directory: dotimage_app
        run: flutter pub get

      - name: Build release APK
        working-directory: dotimage_app
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DotImage-APK
          path: dotimage_app/build/app/outputs/flutter-apk/app-release.apk
          
